<mat-drawer-container class="layout-shell">
  <mat-drawer #drawer="matDrawer" class="sidebar" mode="side" opened>
    <div class="sidebar-brand">
      <div class="sidebar-logo">TowerSync</div>
      <div class="sidebar-subtitle">Disaster Recovery Command</div>
    </div>

    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active-link">
        <span class="sidebar-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        <span class="sidebar-spacer"></span>
        <mat-chip *ngIf="item.badge" [color]="item.badgeColor || 'primary'" selected>{{ item.badge }}</mat-chip>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <mat-toolbar class="topbar" color="primary">
      <button mat-icon-button class="mobile-menu-button" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="topbar-title">TowerSync Platform</div>
      <span class="topbar-fill"></span>
      <ng-container *ngIf="currentUser$ | async as user; else loginButton">
        <div class="topbar-user">
          <mat-icon>account_circle</mat-icon>
          <span>{{ user.username }} ({{ user.role }})</span>
        </div>
        <button mat-button color="accent" (click)="logout()">Logout</button>
      </ng-container>
      <ng-template #loginButton>
        <button mat-button color="accent" routerLink="/login">Login</button>
      </ng-template>
    </mat-toolbar>

    <div class="content-shell">
      <div class="offline-card" *ngIf="offline$">
        <mat-card>
          <mat-card-title>Backend Offline</mat-card-title>
          <mat-card-content>
            <p>Unable to reach the API server at {{ apiBaseUrl }}. Please start the backend or check your connection.</p>
          </mat-card-content>
        </mat-card>
      </div>

      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>

  <div class="loading-overlay" *ngIf="loading$">
    <mat-progress-spinner diameter="70" mode="indeterminate" color="accent"></mat-progress-spinner>
  </div>
</mat-drawer-container>
