spring.application.name=backend
server.port=8080

# H2 Database Configuration
# Use file-based H2 storage so data persists after application shutdown.
# Database files are created under the project folder (./data/towerdb.mv.db).
spring.datasource.url=jdbc:h2:file:./data/towerdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.open-in-view=false

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
